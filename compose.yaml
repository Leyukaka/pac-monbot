# VM mode: docker compose up -d (or podman compose). Secrets go in .env (see .env.example).
services:
  pac:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DB_PATH: /data/pac.db
    volumes:
      - pac-data:/data
    # Local only: expose through an authenticated reverse proxy or cloudflared + Access.
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    security_opt:
      - no-new-privileges:true
volumes:
  pac-data:
